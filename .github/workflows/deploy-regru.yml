# Сборка и загрузка сайта на хостинг reg.ru по FTP при каждом пуше в main.
# Нужны секреты репозитория: FTP_HOST, FTP_USER, FTP_PASSWORD (и, при необходимости, FTP_DIR).
name: Deploy to reg.ru hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist/ via FTP
        if: env.HAS_FTP != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_DIR || 'www/rinakzhigitov.ru/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
      - name: Skipped (no FTP secrets yet)
        if: env.HAS_FTP == ''
        run: echo "FTP secrets are not set — skipping upload."
